[package]
name = "tp-core"
version = "0.4.0"
edition = "2021"
description = "Directory teleportation with worktree-aware bookmarks"
license = "MIT"
repository = "https://github.com/jeffdt/teleport"
authors = ["Jeff DiTeodoro"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"

[dev-dependencies]
tempfile = "3"
